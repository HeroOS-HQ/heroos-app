name: heroos-local

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: heroos-api:local
    init: true
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://heroos:heroos_local@db:5432/heroos
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: heroos-web:local
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3002:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heroos
      POSTGRES_USER: heroos
      POSTGRES_PASSWORD: heroos_local
    ports:
      - "5433:5432"
    volumes:
      - heroos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heroos -d heroos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  heroos_postgres_data:
