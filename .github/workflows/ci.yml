name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @heroos/web lint

      - name: Typecheck
        run: pnpm --filter @heroos/web typecheck

      - name: Test
        run: pnpm --filter @heroos/web test

      - name: Build
        run: pnpm --filter @heroos/web build

  api:
    name: API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.12.2

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app scripts

      - name: Test
        run: uv run pytest
  containers:
    name: Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Web container
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t heroos-web:ci \
            .

      - name: Build API container
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t heroos-api:ci \
            .

  tenant-isolation:
    name: Tenant Isolation
    runs-on: ubuntu-latest

    # Security gate: real PostgreSQL 16 (the same Compose `db` service used
    # locally), per-run generated credentials, no AWS and no stored secrets.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.12.2

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Generate throwaway database credentials
        # Fresh random passwords for this run only, in an untracked .env (0600).
        # Nothing is committed or stored as a repository secret; values are
        # masked in case any later step would print them.
        run: |
          make env-init
          for key in HEROOS_DB_ADMIN_PASSWORD HEROOS_DB_APP_PASSWORD HEROOS_DEV_AUTH_SECRET; do
            echo "::add-mask::$(grep -E "^${key}=" .env | cut -d= -f2-)"
          done
          make env-check

      - name: Start PostgreSQL 16
        run: docker compose up -d --wait db

      - name: Verify migrations (base -> head -> base -> head, RLS assertions)
        run: make migration-check

      - name: Tenant isolation suite (runtime role, RLS, cross-tenant, pool leakage)
        run: make tenant-isolation-check

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes

  backup-restore:
    name: Backup & Restore
    runs-on: ubuntu-latest

    # Recovery gate: logical backup -> restore -> verify on disposable
    # databases in the Compose PostgreSQL 16 service, using its matching
    # pg_dump/pg_restore. Per-run generated credentials, no AWS and no stored secrets.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.12.2

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Generate throwaway database credentials
        # Fresh random passwords for this run only, in an untracked .env (0600).
        # Nothing is committed or stored as a repository secret; values are
        # masked in case any later step would print them.
        run: |
          make env-init
          for key in HEROOS_DB_ADMIN_PASSWORD HEROOS_DB_APP_PASSWORD HEROOS_DEV_AUTH_SECRET; do
            echo "::add-mask::$(grep -E "^${key}=" .env | cut -d= -f2-)"
          done
          make env-check

      - name: Start PostgreSQL 16
        run: docker compose up -d --wait db

      - name: Backup and restore verification (data, schema, RLS, grants, cleanup)
        run: make backup-restore-check

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes

  e2e:
    name: End-to-End
    # Retired for the dev integration branch (pushes to dev and pull requests
    # into it); still runs for main. Locally: make e2e-check.
    if: ${{ github.ref != 'refs/heads/dev' && github.base_ref != 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The real web build, API and PostgreSQL 16 together, signed in through a
    # local OpenID Provider and driven by Chrome (scripts/verify-e2e.sh). The
    # database is a throwaway container on tmpfs; every credential and key is
    # generated for the run. No AWS, no external identity provider, no secrets.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The migration suite runs the older API revisions the staging
          # runbook deploys (git archive of 371dd50 and 169261d).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        run: pipx install uv==0.12.2

      - name: Install Python
        run: uv python install 3.12

      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: End-to-end suites
        run: make e2e-check

      - name: Keep results and screenshots (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/.output/
          retention-days: 14
          if-no-files-found: ignore

  privacy-decisions:
    name: Privacy Decisions
    runs-on: ubuntu-latest

    # Governance gate: the decision register and JJ review packet stay
    # consistent, and no decision appears approved, legally confirmed or
    # implemented without the evidence fields. Standard library only.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate privacy decision register
        run: make privacy-decision-check
