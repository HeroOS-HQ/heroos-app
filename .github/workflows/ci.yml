name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @heroos/web lint

      - name: Typecheck
        run: pnpm --filter @heroos/web typecheck

      - name: Test
        run: pnpm --filter @heroos/web test

      - name: Build
        run: pnpm --filter @heroos/web build

  api:
    name: API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.12.2

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app scripts

      - name: Test
        run: uv run pytest
  containers:
    name: Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Web container
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t heroos-web:ci \
            .

      - name: Build API container
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t heroos-api:ci \
            .

  tenant-isolation:
    name: Tenant Isolation
    runs-on: ubuntu-latest

    # Security gate: real PostgreSQL 16 (the same Compose `db` service used
    # locally), CI-only local credentials, no AWS and no secrets.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.12.2

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Start PostgreSQL 16
        run: docker compose up -d --wait db

      - name: Verify migrations (base -> head -> base -> head, RLS assertions)
        run: make migration-check

      - name: Tenant isolation suite (runtime role, RLS, cross-tenant, pool leakage)
        run: make tenant-isolation-check

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes
